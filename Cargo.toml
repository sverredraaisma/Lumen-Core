[workspace]
resolver = "2"
members = [
    "crates/lumen-proto",
    "crates/lumen-vm",
    "crates/lumen-lang",
    "crates/lumen-hal",
    "crates/lumen-cli",
    "crates/lumen-crypto",
]
# The conformance adapter is deliberately not a member. It depends on the
# runner in the sibling `lumen-spec` checkout, and making `cargo test
# --workspace` need that checkout would put a second repo between a contributor
# and a green test run. The conformance CI job builds it explicitly.
exclude = ["adapters/conformance"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/sverredraaisma/Lumen-Core"
rust-version = "1.85"
authors = ["The Lumen contributors"]

[workspace.dependencies]
lumen-proto = { version = "0.1.0", path = "crates/lumen-proto" }
lumen-vm    = { version = "0.1.0", path = "crates/lumen-vm" }
lumen-lang  = { version = "0.1.0", path = "crates/lumen-lang" }
lumen-hal   = { version = "0.1.0", path = "crates/lumen-hal" }
lumen-crypto = { version = "0.1.0", path = "crates/lumen-crypto" }
