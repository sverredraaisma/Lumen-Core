[package]
name = "lumen-vm"
description = "Lumen bytecode VM: pixel and sim profiles, Q16.16 fixed point, allocation-free"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[features]
# `builder` is on by default because the compiler, the simulator and every test
# need it. It pulls in `alloc`, so firmware builds turn it off:
#     lumen-vm = { version = "0.1", default-features = false }
default = ["builder"]
builder = []

[dependencies]
